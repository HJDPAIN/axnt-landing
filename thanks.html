<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks | AXNT Wood Products</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1c1814">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c1814;--paper:#f4eee5;--muted:#c9c0b4;--accent:#b0501a;--accent-light:#e0843f;--line:#463a30}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--ink);color:var(--paper);font:400 1.0625rem/1.6 "Archivo",system-ui,sans-serif;padding:24px 16px}
main{max-width:620px}
.eyebrow{font:500 .8rem/1 "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-light);margin:0 0 18px}
h1{font-weight:800;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.05;letter-spacing:-.02em;margin:0 0 18px}
p{color:var(--muted);margin:0 0 14px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px;padding-top:28px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;min-height:50px;padding:.75em 1.4em;border-radius:4px;font-weight:600;text-decoration:none;border:2px solid transparent}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#97440f}
.btn-ghost{border-color:currentColor;color:var(--paper)}
:focus-visible{outline:3px solid var(--accent-light);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="eyebrow">AXNT Wood Products</p>
  <h1>Got it. Your quote request is in.</h1>
  <p>We'll review your project and get back to you within 1 business day [confirm].</p>
  <p>If the job is time-sensitive, call the shop and we'll pull up your request.</p>
  <div class="ctas">
    <a class="btn btn-primary" href="tel:+14357532731">Call 435-753-2731</a>
    <a class="btn btn-ghost" href="/">Back to the site</a>
  </div>
</main>
</body>
</html>
